- name: Vladyslav Korobeynyk
  image: img/thumbnail/vlad.png
  links:
    - { icon: github, text: "vkorobeynyk", href: "https://github.com/vkorobeynyk" }
  bio: >-
    I did my master thesis in single cell analysis of the adult mouse hippocampus in
    Jessberger Lab, HIFO, UZH. Shortly after, I started working as an intern in Systems
    Biology group at Roche, where I gained experience in ML and different type of
    sequencing technologies. Currently I am doing a shared PhD with Jessberger Lab, where
    my project is based on using single-cell and spatial transcriptomics data to identify
    molecular changes, mainly in the neurogenic niche, that drive neurogenesis to decline
    with age.
  degrees:
    - MSc in Biochemistry (2021), University of Zurich
    - BSc in Biochemistry (2017), University Nova of Lisbon

