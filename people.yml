- name: Meenu Bhati
  image: img/thumbnail/Meenu.jpeg
  links:
    - { icon: mortarboard, text: "Google Scholar", href: "https://scholar.google.com/citations?user=l2kH-6EAAAAJ&hl=en&authuser=1" }
  bio: >-
    My research focuses on understanding genome biology across species from functional and
    evolutionary perspectives. I integrate genetics and multi-omics approaches to
    investigate regulatory mechanisms within the non-coding genome, with particular
    emphasis on long non-coding RNAs. Through this work, I aim to advance the functional
    interpretation of regulatory variation associated with complex traits while developing
    computational resources for the broader scientific community.
  degrees:
    - PhD in Animal Genomics (2024), ETH Zurich, Switzerland
    - MSc in Animal Genomics & Breeding (2017), Wageningen University, Netherlands
    - BVSc&AH in Veterinary & Animal Sciences (2014), Rajasthan University of Veterinary and Animal Sciences, India

