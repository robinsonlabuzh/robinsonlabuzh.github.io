# Lab members, shown on people.html in this order.
#
# To add someone, copy an entry and edit it. Fields:
#   name     (required)
#   image    (required) path to a thumbnail in img/thumbnail/, under 100KB
#   links    (optional) list of {icon, text, href}; icon names from
#            https://icons.getbootstrap.com (github, linkedin, twitter-x,
#            mortarboard for Google Scholar, globe for a website, ...)
#   bio      (optional) Markdown; for several paragraphs use | and blank lines
#   degrees  (optional) list, one per line
#
# Former members are commented out in place; uncomment an entry to show it
# again. When someone leaves, comment out their entry and add them to the
# Alumni list in people.qmd.

- name: Mark D Robinson
  image: img/thumbnail/mark.jpg
  links:
    - { icon: twitter-x, text: "@markrobinsonca", href: "https://twitter.com/markrobinsonca" }
    - { icon: github, text: "markrobinsonuzh", href: "https://github.com/markrobinsonuzh" }
    - { icon: mortarboard, text: "Google Scholar", href: "https://scholar.google.ch/citations?user=XPfrRQEAAAAJ" }
  bio: >-
    My research interests are diverse, but more-or-less encompass the general application
    of statistical methods and data science to experimental data with biological
    applications. Often, this is within the context of genomics data types, but we are
    interested in methodological challenges and robust solutions in data, generally. We
    also try to be modern scientists, with a focus on reproducibility (repos for code) and
    open science (preprints).
  degrees:
    - PhD in Medical Biology (2008), University of Melbourne (Walter and Eliza Hall Institute)
    - MSc in Statistics (2001), University of British Columbia
    - BSc in Applied Mathematics and Statistics (1999), University of Guelph

