- name: Jiayi Wang
  image: img/thumbnail/jiayi.jpg
  links:
    - { icon: linkedin, text: "LinkedIn", href: "https://www.linkedin.com/in/jiayi-wang-14a3261ba/" }
  bio: >-
    After finishing an internship and my master thesis in the Robinson group, I joined as a
    PhD student. During this time I worked on disentangling type and state effects on
    expression variability to improve analysis and interpretability of scRNA-seq data and
    identifying motif accessibility changes in ATAC-seq data. My PhD project primarily
    focuses on data analysis of long-read scRNA data and image analysis.
  degrees:
    - MSc in Computational Biology and Bioinformatics (2024), ETH Zürich
    - BSc in Biomedical Sciences (2021), University College London

- name: Maruša Koderman
  image: img/thumbnail/marusa.jpg
  bio: >-
    I joined the Robinson lab as a PhD student in 2024. Prior to starting my PhD, I worked
    as in intern at Roche (Pharma Research and Early Development), where I focused on
    single-cell data analysis and construction of human brain cell type atlases. In my PhD,
    I am continuing this work by leveraging large-scale multimodal single-cell atlases to
    advance the development of in vitro model systems and investigate new potential drug
    targets.
  degrees:
    - MSc in Laboratory Biomedicine (2021), University of Ljubljana
    - BSc in Laboratory Biomedicine(2017), University of Ljubljana

- name: Pauline Busch
  image: img/thumbnail/pauline.jpg
  links:
    - { icon: linkedin, text: "LinkedIn", href: "https://www.linkedin.com/in/pauline-busch" }
  bio: >-
    I joined the Robinson lab as a PhD student at the end of 2024. My background is in
    biomedical research, with previous work focusing on pathophysiological processes in
    blood and brain. During my master’s studies I developed an interest in bioinformatics
    and during my PhD I aim to contribute to the development of methods for analyzing
    spatial transcriptomics data.
  degrees:
    - MSc in Molecular Life Sciences (2022), University of Hamburg
    - BSc in Biology (2019), University of Hamburg

- name: Ben Carrillo
  image: img/thumbnail/ben.jpg
  bio: >-
    PhD student at Robinson lab since Spring 2025. I am interested in building robust,
    composable tools for reproducible biomedical research. Working on tools for methods
    benchmarking.
  degrees:
    - MSc in Biostatistics and Bioinformatics (2023), Universitat Oberta de Catalunya

- name: Atreya Choudhury
  image: img/thumbnail/atreya.jpeg
  links:
    - { icon: github, text: "atchox", href: "https://github.com/atchox" }
  bio: >-
    I started in August 2026 as a shared PhD student between the
    [Domcke](https://domcke.github.io/domcke-lab.html) and Robinson labs. I am interested
    in several aspects of single-cell perturbation data, particularly methods development
    and the relevance of such data in understanding the landscape of cells. I also work on
    benchmarking computational methods for omics data.
  degrees:
    - MSc in Statistics (2026), ETH Zürich
    - Bachelor of Mathematics (Hons.) (2023), Indian Statistical Institute, Bangalore

- name: Xiaorou Guo
  image: img/thumbnail/xiaorou.jpg
  links:
    - { icon: linkedin, text: "LinkedIn", href: "https://www.linkedin.com/in/xiaorou-guo" }
  bio: >-
    I joined the Robinson lab as a visiting PhD student in August 2026 for a six-month
    visit ending in February 2027. Previously, I worked on developing reference datasets
    and benchmarking frameworks for genomic and epigenomic analyses. I am currently
    benchmarking single-cell foundation models, with a focus on their performance across
    different biological tasks.
  degrees:
    - PhD candidate in Bioinformatics (expected 2027), Fudan University, China
    - BSc in Biotechnology, Beijing University of Technology, China

- name: Miguel Rosell Hidalgo
  image: img/thumbnail/miguel.jpg
  links:
    - { icon: github, text: "miguelrosell", href: "https://github.com/miguelrosell" }
    - { icon: linkedin, text: "LinkedIn", href: "https://www.linkedin.com/in/miguel-rosell-hidalgo" }
  bio: >-
    I am an external Master's student in Bioinformatics and Biostatistics, doing my thesis
    in the Robinson lab. My project compares what pathology foundation models and classical
    texture descriptors (Local Binary Patterns) capture in H&E images, and how both relate
    to spatial transcriptomics. Before joining, I applied Transcriptome-Wide Association
    Studies (TWAS) to psychiatric traits at the CBMSO-CSIC in Madrid. I am interested in
    statistical methods for high-dimensional biomedical data.
  degrees:
    - MSc in Bioinformatics and Biostatistics, Universitat Oberta de Catalunya (ongoing)
    - BSc in Bioinformatics (2026), Universidad Católica de Ávila
    - BA in Translation and Interpreting (2023), Universidad Complutense de Madrid

