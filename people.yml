- name: Martin Emons
  image: img/thumbnail/martin.jpg
  bio: >-
    I am a PhD student in the Robinson Group since 2022 in the Epidemiology and
    Biostatistics PhD program. My general interest lies in the development of methods for
    biological and biomedical data science. In my master studies I worked on various topics
    such as statistical analysis of temporal trends or survival analysis at Roche
    Diagnostics. Currently, I am interested in spatial transcriptomics and the challenges
    in this new field.
  degrees:
    - MSc in Computational Biology and Bioinformatics (2022), ETH Zürich, University of Zürich
    - BSc in Biology (2019), University of Bern

- name: Samuel Gunz
  image: img/thumbnail/samuel.jpeg
  links:
    - { icon: twitter-x, text: "@samuelgunz", href: "https://twitter.com/samuelgunz" }
    - { icon: github, text: "sgunz", href: "https://github.com/sgunz" }
  bio: >-
    I am a PhD student in the Robinson lab as part of the Epidemiology and Biostatistics
    program of the Life Science Graduate School Zurich. During my past studies, I worked
    with all sorts of biological data, ranging from microbial community analysis to
    characterizing epigenetic modifications in cancer. During this time, I acknowledged the
    importance of having robust and reproducible tools in research and that my interest
    lies in developing such. My PhD project will focus on methods for analyzing spatial
    omics data.
  degrees:
    - MSc in Computational Biology and Bioinformatics (2022), ETH Zurich, University of Basel and University of Zurich
    - BSc in Biology (2018), University of Zurich

