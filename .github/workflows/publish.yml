name: Build and publish website

on:
  push:
    branches: [master]
  # Pull requests: build only, to check the site still renders. Nothing is published.
  pull_request:
    branches: [master]
  # Weekly rebuild so the publication list picks up new papers.
  schedule:
    - cron: "0 5 * * 1" # Mondays, 05:00 UTC
  # Allows a manual rebuild from the Actions tab.
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  # Cancel superseded PR builds, but never interrupt a deployment.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      # Optional NCBI API key (repo secret) for higher PubMed rate limits.
      ENTREZ_KEY: ${{ secrets.ENTREZ_KEY }}
    steps:
      - uses: actions/checkout@v4

      - uses: quarto-dev/quarto-actions/setup@v2

      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      # Installs the packages listed in DESCRIPTION (cached between runs).
      - uses: r-lib/actions/setup-r-dependencies@v2

      - name: Render site
        run: quarto render

      - uses: actions/upload-pages-artifact@v3
        if: github.event_name != 'pull_request'
        with:
          path: _site

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
