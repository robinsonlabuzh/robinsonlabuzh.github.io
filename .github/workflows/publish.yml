name: Build and publish website

on:
  push:
    branches: [master]
  # Pull requests: build only, to check the site still renders. Nothing is published.
  pull_request:
    branches: [master]
  # Weekly rebuild so the publication list picks up new papers. Published only
  # if the publication list changed, and only after approval (see "approve").
  schedule:
    - cron: "0 5 * * 1" # Mondays, 05:00 UTC
  # Allows a manual rebuild from the Actions tab.
  workflow_dispatch:

permissions:
  contents: read

env:
  SITE_URL: https://robinsonlabuzh.github.io

concurrency:
  # One run at a time per branch and trigger. A newer pull-request build or
  # weekly build replaces an older one, including a weekly build still waiting
  # for approval. Pushes to master and manual runs are never cancelled.
  group: build-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' || github.event_name == 'schedule' }}

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.compare.outputs.changed }}
    env:
      # Optional NCBI API key (repo secret) for higher PubMed rate limits.
      ENTREZ_KEY: ${{ secrets.ENTREZ_KEY }}
    steps:
      - uses: actions/checkout@v7

      - uses: quarto-dev/quarto-actions/setup@v2

      # Must match r_version in rproject.toml.
      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: "4.6"

      - name: Install rv
        run: |
          curl -sSL https://raw.githubusercontent.com/A2-ai/rv/refs/heads/main/scripts/install.sh | bash
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          # rv's download cache, saved between runs by the next step. (Set here:
          # the runner context is not available in the job-level env block.)
          echo "RV_CACHE_DIR=$RUNNER_TEMP/rv-cache" >> "$GITHUB_ENV"

      - name: Cache rv downloads
        uses: actions/cache@v6
        with:
          path: ${{ runner.temp }}/rv-cache
          key: rv-${{ runner.os }}-${{ hashFiles('rv.lock') }}
          restore-keys: rv-${{ runner.os }}-

      # Installs the system libraries the R packages need (pandoc comes with Quarto).
      - name: Install system dependencies
        run: |
          deps=$(rv sysdeps --only-absent --ignore pandoc)
          echo "Missing system dependencies: ${deps:-none}"
          if [ -n "$deps" ]; then
            sudo apt-get update
            sudo apt-get install -y $deps
          fi

      # Installs the R packages pinned in rv.lock (PPM binaries); fails if
      # rv.lock is out of date with rproject.toml.
      - name: Install R packages
        run: rv sync --locked

      # R starts in the project folder, so .Rprofile activates the rv library.
      - name: Render site
        run: quarto render

      # Weekly builds: compare the new publication list with the live site's.
      # Sets changed=true/false and lists the differences on the run's summary page.
      - name: Compare publications with the live site
        id: compare
        if: github.event_name == 'schedule'
        run: python3 .github/scripts/compare-publications.py _site/publications.html "$SITE_URL/publications.html"

      # The site as GitHub Pages will publish it (not for pull requests, nor for
      # weekly builds without changes). Kept 7 days, so that a weekly build can
      # still be published when it is approved a few days later.
      - uses: actions/upload-pages-artifact@v5
        if: github.event_name != 'pull_request' && steps.compare.outputs.changed != 'false'
        with:
          path: _site
          retention-days: 7

      # Pull requests and changed weekly builds: attach the built site to the
      # run so reviewers can look at it before it is published (download from
      # the run page's Artifacts section, unzip, open index.html). Deleted after
      # 14 days; the live site is not affected.
      - uses: actions/upload-artifact@v7
        if: github.event_name == 'pull_request' || steps.compare.outputs.changed == 'true'
        with:
          name: ${{ github.event_name == 'pull_request' && format('site-preview-pr{0}', github.event.pull_request.number) || format('site-preview-weekly-{0}', github.run_number) }}
          path: _site
          retention-days: 14

  # Weekly builds whose publication list changed wait here until one of the
  # required reviewers of the "weekly-update" environment approves the run
  # (Settings > Environments > weekly-update). Rejecting it publishes nothing.
  approve:
    if: github.event_name == 'schedule' && needs.build.outputs.changed == 'true'
    needs: build
    runs-on: ubuntu-latest
    environment: weekly-update
    steps:
      - run: echo "Weekly publication update approved."

  # Pushes to master and manual runs publish directly; weekly builds only once
  # approved (and not at all if nothing changed). Pull requests never publish.
  deploy:
    needs: [build, approve]
    if: >-
      ${{ !cancelled() && needs.build.result == 'success' &&
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch' ||
      needs.approve.result == 'success') }}
    runs-on: ubuntu-latest
    # Deployments run one at a time and are never cancelled. (Kept separate
    # from the run-level group, so a weekly build waiting for approval does
    # not hold up deployments of pushes to master.)
    concurrency:
      group: pages-deploy
      cancel-in-progress: false
    permissions:
      actions: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      # If master moved on while a weekly build waited for approval, that newer
      # commit has already been published (with current publications); don't
      # replace it with this older build.
      - name: Check the build is still current
        id: current
        if: github.event_name == 'schedule'
        run: |
          head=$(git ls-remote "https://github.com/${{ github.repository }}" refs/heads/master | cut -f1)
          if [ "$head" = "${{ github.sha }}" ]; then
            echo "current=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::master has moved on since this build (${{ github.sha }} -> $head); not publishing it."
            echo "current=false" >> "$GITHUB_OUTPUT"
          fi

      - id: deployment
        if: steps.current.outputs.current != 'false'
        uses: actions/deploy-pages@v5
